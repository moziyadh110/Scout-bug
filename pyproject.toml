[project]
name = "forge"
version = "0.1.0"
description = "An AI dev team that fixes bugs for on-chain bounties and improves its own playbook nightly."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "tenacity>=8.5",
]

[project.optional-dependencies]
solana = ["solana>=0.34", "solders>=0.21"]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
