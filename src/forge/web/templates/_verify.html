{% if r.ok %}<span class="ok">✓ verified</span>{% else %}<span class="bad">✗ mismatch</span>{% endif %}
<details><summary class="muted">details</summary><pre>stored     {{ r.stored_hash }}
recomputed {{ r.recomputed_hash }}
ledger     {{ r.ledger_memo }}{% if r.error %}
error      {{ r.error }}{% endif %}</pre>{% if r.explorer_url %}<a href="{{ r.explorer_url }}" target="_blank">explorer</a>{% endif %}</details>
